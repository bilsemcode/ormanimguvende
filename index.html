<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ormanım Güvende</title>

<style>

body{
margin:0;
padding:0;
background:#1e1e1e;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

canvas{
border:6px solid #000;
border-radius:10px;
box-shadow:0 0 30px rgba(0,0,0,0.7);
}

</style>

</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>

class MenuScene extends Phaser.Scene{

constructor(){
super("MenuScene")
}

create(){

let w=this.scale.width
let h=this.scale.height

this.cameras.main.setBackgroundColor("#ffffff")

this.add.text(w/2,120,"Ormanım Güvende",{
fontSize:"48px",
color:"#2b2b2b",
fontStyle:"bold"
}).setOrigin(0.5)

this.add.text(w/2,200,"Seviye Seç",{
fontSize:"28px",
color:"#444"
}).setOrigin(0.5)

let anaokulu=this.add.text(w/2,320,"ANAOKULU",{
fontSize:"32px",
color:"#000",
backgroundColor:"#eaeaea",
padding:10
}).setOrigin(0.5).setInteractive()

let ilkokul=this.add.text(w/2,400,"İLKOKUL",{
fontSize:"32px",
color:"#000",
backgroundColor:"#eaeaea",
padding:10
}).setOrigin(0.5).setInteractive()

let ortaokul=this.add.text(w/2,480,"ORTAOKUL",{
fontSize:"32px",
color:"#000",
backgroundColor:"#eaeaea",
padding:10
}).setOrigin(0.5).setInteractive()

anaokulu.on("pointerdown",()=>{
this.scene.start("GameScene",{level:"ana"})
})

ilkokul.on("pointerdown",()=>{
this.scene.start("GameScene",{level:"ilk"})
})

ortaokul.on("pointerdown",()=>{
this.scene.start("GameScene",{level:"orta"})
})

}

}



class GameScene extends Phaser.Scene{

constructor(){
super("GameScene")
}

init(data){
this.level=data.level
}

create(){

let w=this.scale.width
let h=this.scale.height

this.cameras.main.setBackgroundColor("#ffffff")

this.oxygen=100

if(this.level=="ana"){
this.lives=5
}else{
this.lives=3
}

this.add.text(20,20,"Seviye: "+this.level,{
fontSize:"22px",
color:"#000"
})

this.add.text(20,50,"Can: "+this.lives,{
fontSize:"22px",
color:"#000"
})

this.add.text(20,80,"Oksijen",{
fontSize:"20px",
color:"#000"
})

this.add.rectangle(140,95,200,20,0xcccccc).setOrigin(0,0.5)

this.oxygenBar=this.add.rectangle(140,95,200,20,0x32c96a).setOrigin(0,0.5)

this.player=this.add.rectangle(w/2,h/2,40,40,0x2f4bd1)

this.cursors=this.input.keyboard.createCursorKeys()
this.keys=this.input.keyboard.addKeys("W,A,S,D")

}



update(){

let speed=4

if(this.level=="ana"){
speed=5
}

if(this.level=="orta"){
speed=3
}

if(this.cursors.left.isDown || this.keys.A.isDown){
this.player.x-=speed
}

if(this.cursors.right.isDown || this.keys.D.isDown){
this.player.x+=speed
}

if(this.cursors.up.isDown || this.keys.W.isDown){
this.player.y-=speed
}

if(this.cursors.down.isDown || this.keys.S.isDown){
this.player.y+=speed
}

this.oxygenBar.width=2*this.oxygen

}

}



const config={
type:Phaser.AUTO,
width:1280,
height:720,
scene:[MenuScene,GameScene],
scale:{
mode:Phaser.Scale.FIT,
autoCenter:Phaser.Scale.CENTER_BOTH
}
}

new Phaser.Game(config)

</script>

</body>
</html>

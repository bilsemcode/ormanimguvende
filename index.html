<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ormanım Güvende</title>

<style>
body{
margin:0;
padding:0;
background:#1e1e1e;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

canvas{
border:6px solid #000;
border-radius:10px;
box-shadow:0 0 30px rgba(0,0,0,0.7);
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>

class MenuScene extends Phaser.Scene{

constructor(){
super("MenuScene")
}

create(){

let w=this.scale.width

this.cameras.main.setBackgroundColor("#f7f7f7")

this.add.text(w/2,110,"Ormanım Güvende",{
fontSize:"52px",
color:"#1f3b1f",
fontStyle:"bold"
}).setOrigin(0.5)

this.add.text(w/2,185,"Seviye Seç",{
fontSize:"28px",
color:"#555"
}).setOrigin(0.5)

const makeButton=(y,label,key)=>{

let btn=this.add.text(w/2,y,label,{
fontSize:"32px",
color:"#000",
backgroundColor:"#dff1df",
padding:{left:22,right:22,top:12,bottom:12}
})
.setOrigin(0.5)
.setInteractive()

btn.on("pointerdown",()=>{
this.scene.start("GameScene",{level:key})
})

}

makeButton(310,"ANAOKULU","ana")
makeButton(395,"İLKOKUL","ilk")
makeButton(480,"ORTAOKUL","orta")

}

}



class GameScene extends Phaser.Scene{

constructor(){
super("GameScene")
}

init(data){
this.level=data.level
}

create(){

let w=this.scale.width
let h=this.scale.height

this.cameras.main.setBackgroundColor("#8ecf6e")

this.oxygen=100
this.score=0

if(this.level==="ana"){
this.lives=5
this.playerSpeed=5
}else if(this.level==="ilk"){
this.lives=3
this.playerSpeed=4
}else{
this.lives=3
this.playerSpeed=3
}

this.add.text(20,20,"Seviye: "+this.level,{
fontSize:"22px",
color:"#000"
})

this.add.text(20,50,"Can: "+this.lives,{
fontSize:"22px",
color:"#000"
})

this.add.text(20,80,"Oksijen",{
fontSize:"20px",
color:"#000"
})

this.add.rectangle(140,95,220,20,0xcccccc).setOrigin(0,0.5)
this.oxygenBar=this.add.rectangle(140,95,220,20,0x33c76a).setOrigin(0,0.5)

this.scoreText=this.add.text(400,20,"Puan: 0",{
fontSize:"22px",
color:"#000"
})

/* KARAKTER */

this.player=this.add.container(w/2,h/2)

let shadow=this.add.ellipse(0,20,28,10,0x000000,0.2)

this.leftLeg=this.add.rectangle(-6,12,8,18,0x1b2a41)
this.rightLeg=this.add.rectangle(6,12,8,18,0x1b2a41)

let body=this.add.rectangle(0,0,22,28,0x2f80ed)

this.leftArm=this.add.rectangle(-14,0,6,18,0xf2c6a0)
this.rightArm=this.add.rectangle(14,0,6,18,0xf2c6a0)

let head=this.add.circle(0,-20,10,0xf2c6a0)

this.player.add([
shadow,
this.leftLeg,
this.rightLeg,
this.leftArm,
this.rightArm,
body,
head
])

this.cursors=this.input.keyboard.createCursorKeys()
this.keys=this.input.keyboard.addKeys("W,A,S,D")

}

update(){

let speed=this.playerSpeed
let vx=0
let vy=0

if(this.cursors.left.isDown || this.keys.A.isDown){
vx=-speed
}

if(this.cursors.right.isDown || this.keys.D.isDown){
vx=speed
}

if(this.cursors.up.isDown || this.keys.W.isDown){
vy=-speed
}

if(this.cursors.down.isDown || this.keys.S.isDown){
vy=speed
}

this.player.x+=vx
this.player.y+=vy

this.leftLeg.y=12+Math.sin(Date.now()/120)*4
this.rightLeg.y=12-Math.sin(Date.now()/120)*4

this.leftArm.y=Math.sin(Date.now()/120)*3
this.rightArm.y=-Math.sin(Date.now()/120)*3

this.oxygen=Math.max(0,this.oxygen-0.01)
this.oxygenBar.width=2.2*this.oxygen

}

}



const config={
type:Phaser.AUTO,
width:1280,
height:720,
scene:[MenuScene,GameScene],
scale:{
mode:Phaser.Scale.FIT,
autoCenter:Phaser.Scale.CENTER_BOTH
}
}

new Phaser.Game(config)

</script>

</body>
</html>
